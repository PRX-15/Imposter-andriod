name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name imposter_android --org com.prx15 .

      - name: Use stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode tooling/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Set increasing Android version
        run: |
          sed -i "s/^version:.*/version: 1.0.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="IMPOSTER"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze Dart
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -f "$apk" ]]; then
            echo "Missing apksigner or ARM64 APK."
            exit 1
          fi
          expected="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | awk -F'SHA256: ' '/SHA256:/{gsub(":", "", $2); print tolower($2); exit}')"
          actual="$("$apksigner" verify --print-certs "$apk" | awk -F'SHA-256 digest: ' '/Signer #1 certificate SHA-256 digest:/{gsub(":", "", $2); print tolower($2); exit}')"
          if [[ -z "$expected" || -z "$actual" ]]; then
            echo "Could not read signing certificate fingerprints."
            exit 1
          fi
          if [[ "$expected" != "$actual" ]]; then
            echo "APK certificate does not match the stable debug key."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "APK uses the stable debug signing certificate."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imposter-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
