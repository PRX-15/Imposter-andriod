name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name imposter_android --org com.prx15 .

      - name: Use stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode tooling/debug.keystore.b64 > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey

      - name: Configure stable debug signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()
          marker = "android {\n"
          if marker not in text:
              raise SystemExit("Could not find the Android Gradle configuration block.")

          signing = """android {
              signingConfigs {
                  getByName("debug") {
                      storeFile = file(System.getProperty("user.home") + "/.android/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          """
          text = text.replace(marker, signing, 1)
          debug_marker = '    buildTypes {\n'
          debug_config = """    buildTypes {
              getByName("debug") {
                  signingConfig = signingConfigs.getByName("debug")
              }
          """
          if debug_marker not in text:
              raise SystemExit("Could not find the buildTypes block.")
          text = text.replace(debug_marker, debug_config, 1)
          path.write_text(text)
          print("Configured debug build type to use $HOME/.android/debug.keystore")
          PY
          grep -A8 -B2 'getByName("debug")' android/app/build.gradle.kts

      - name: Set increasing Android version
        run: |
          sed -i "s/^version:.*/version: 1.0.${GITHUB_RUN_NUMBER}+${GITHUB_RUN_NUMBER}/" pubspec.yaml

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app launcher icon
        run: dart run flutter_launcher_icons

      - name: Generate native splash screen
        run: dart run flutter_native_splash:create

      - name: Set Android app display name
        run: sed -i 's/android:label="[^"]*"/android:label="IMPOSTER"/' android/app/src/main/AndroidManifest.xml

      - name: Analyze Dart
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build ARM64 debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Verify APK signing certificate
        shell: bash
        run: |
          set -euo pipefail
          apk="build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [[ -z "$apksigner" || ! -f "$apk" ]]; then
            echo "Missing apksigner or ARM64 APK."
            exit 1
          fi
          keytool_output="$(keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey)"
          expected="$(printf '%s\n' "$keytool_output" | sed -nE 's/.*Certificate fingerprint \(SHA-256\): ([[:xdigit:]:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          apksigner_output="$("$apksigner" verify --print-certs "$apk" 2>&1)"
          actual="$(printf '%s\n' "$apksigner_output" | sed -nE 's/.*SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*/\1/p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$expected" ]]; then
            echo "Could not read the stable debug key fingerprint. keytool output:"
            printf '%s\n' "$keytool_output"
            exit 1
          fi
          if [[ -z "$actual" ]]; then
            echo "Could not read the APK signing fingerprint. apksigner output:"
            printf '%s\n' "$apksigner_output"
            exit 1
          fi
          if [[ "$expected" != "$actual" ]]; then
            echo "APK certificate does not match the stable debug key."
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi
          echo "APK uses the stable debug signing certificate."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: imposter-arm64-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
