name: imposter_android
description: Offline pass-and-play IMPOSTER game for Android.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/icons/presplash.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/icon.png
  adaptive_icon_background: "#090413"
  adaptive_icon_foreground: assets/icons/icon.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#090413"
  image: assets/icons/presplash.png
  android: true
  ios: false
  android_12:
    color: "#090413"
    image: assets/icons/presplash.png
